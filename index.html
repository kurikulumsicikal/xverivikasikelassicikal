<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Kesesuaian Data Siswa</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 20px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            margin-top: 10px;
        }
        h2 {
            text-align: center;
            color: #1a202c;
            margin-top: 0;
            margin-bottom: 6px;
            font-size: 20px;
        }
        p.subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        button {
            padding: 10px 18px;
            background-color: #3182ce;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background-color: #2b6cb0;
        }
        .loading {
            text-align: center;
            color: #718096;
            display: none;
            margin: 20px 0;
            font-weight: 600;
            font-size: 14px;
        }
        .error-box {
            background-color: #fff5f5;
            color: #e53e3e;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #fed7d7;
            display: none;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .result-card {
            display: none;
            margin-top: 15px;
        }
        .instruction {
            background-color: #fffaf0;
            border: 1px solid #feebc8;
            color: #c05621;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        
        /* Desain Kartu Per Item Data (Mobile Friendly) */
        .data-item-card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .data-label {
            font-size: 12px;
            font-weight: 700;
            color: #4a5568;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .data-value {
            font-size: 15px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            word-break: break-word;
        }
        .action-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .btn-sesuai {
            background-color: #38a169;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            flex: 1;
        }
        .btn-sesuai:hover { background-color: #2f855a; }
        .btn-koreksi {
            background-color: #e53e3e;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            flex: 1;
        }
        .btn-koreksi:hover { background-color: #c53030; }
        
        .edit-container {
            display: none;
            margin-top: 10px;
        }
        .edit-input {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            margin-bottom: 6px;
            outline: none;
        }
        .btn-kirim {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            width: 100%;
            font-weight: 600;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 6px;
        }
        .badge-sesuai { background-color: #c6f6d5; color: #22543d; width: 100%; text-align: center; }
        .badge-koreksi { background-color: #fed7d7; color: #c53030; width: 100%; word-break: break-word; }
    </style>
</head>
<body>

<div class="container">
    <h2>Verifikasi Data Siswa</h2>
    <p class="subtitle">Masukkan NIPD Anda untuk memeriksa dan mengonfirmasi kesesuaian data administrasi.</p>
    
    <div class="search-box">
        <input type="text" id="nipdInput" placeholder="Masukkan NIPD Anda...">
        <button onclick="verifikasiSiswa()">Cek Data</button>
    </div>

    <div id="loading" class="loading">Memeriksa database sekolah...</div>
    <div id="errorBox" class="error-box"></div>

    <div id="resultCard" class="result-card">
        <div class="instruction" id="instructionBox">
            💡 <strong>Petunjuk:</strong> Periksa setiap data di bawah. Klik tombol <strong>Sesuai</strong> jika benar, atau klik <strong>Koreksi</strong> untuk mengetik perbaikan data administrasi.
        </div>
        <div id="dataCardList"></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwKVnTxE7WrRNw_IoId4VmIepYNLEBbXWIypGgNJ7ohWNSoKOb1z6nqZRUIUMT4zL5mJw/exec";
    let currentSiswaNama = "";
    let currentSiswaNipd = "";

    function verifikasiSiswa() {
        const nipd = document.getElementById('nipdInput').value.trim();
        const loadingDiv = document.getElementById('loading');
        const errorBox = document.getElementById('errorBox');
        const resultCard = document.getElementById('resultCard');

        if (!nipd) {
            alert('Harap masukkan NIPD terlebih dahulu!');
            return;
        }

        resultCard.style.display = 'none';
        errorBox.style.display = 'none';
        loadingDiv.style.display = 'block';

        fetch(`${API_URL}?nipd=${encodeURIComponent(nipd)}`)
            .then(response => response.json())
            .then(data => {
                loadingDiv.style.display = 'none';

                if (data.found) {
                    currentSiswaNama = data.nama || '-';
                    currentSiswaNipd = data.nipd || '-';

                    let tglLahirFormatted = data.tanggalLahir ? new Date(data.tanggalLahir).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '-';

                    let rows = [
                        { label: "Nama Lengkap", val: currentSiswaNama },
                        { label: "Jenis Kelamin", val: data.jk === 'L' ? 'Laki-Laki' : (data.jk === 'P' ? 'Perempuan' : data.jk || '-') },
                        { label: "NIPD", val: currentSiswaNipd },
                        { label: "NISN", val: data.nisn || '-' },
                        { label: "Tempat Lahir", val: data.tempatLahir || '-' },
                        { label: "Tanggal Lahir", val: tglLahirFormatted },
                        { label: "NIK", val: data.nik || '-' },
                        { label: "Agama", val: data.agama || '-' },
                        { label: "Alamat", val: data.alamat || '-' },
                        { label: "RT", val: data.rt !== undefined && data.rt !== "" ? data.rt : '-' },
                        { label: "RW", val: data.rw !== undefined && data.rw !== "" ? data.rw : '-' },
                        { label: "Kelurahan/Desa", val: data.kelurahan || '-' },
                        { label: "Kecamatan", val: data.kecamatan || '-' },
                        { label: "Kode Pos", val: data.kodePos || '-' },
                        { label: "Nama Ayah", val: data.namaAyah || '-' },
                        { label: "Pekerjaan Ayah", val: data.pekerjaanAyah || '-' },
                        { label: "Nama Ibu", val: data.namaIbu || '-' },
                        { label: "Pekerjaan Ibu", val: data.pekerjaanIbu || '-' },
                        { label: "Rombel Saat Ini", val: data.rombel || '-' },
                        { label: "Sekolah Asal", val: data.sekolahAsal || '-' },
                        { label: "Anak ke-", val: data.anakKe ? `Anak ke-${data.anakKe}` : '-' }
                    ];

                    let cardsHtml = "";
                    
                    rows.forEach((row, index) => {
                        let savedVal = data.statusKesesuaian ? data.statusKesesuaian[row.label] : "";
                        let badgeHtml = "";
                        let defaultInputVal = "";

                        if (savedVal === "Sesuai") {
                            badgeHtml = `<div id="badgeContainer_${index}"><div class="status-badge badge-sesuai">✓ Status: Sesuai</div></div>`;
                        } else if (savedVal && savedVal !== "") {
                            badgeHtml = `<div id="badgeContainer_${index}"><div class="status-badge badge-koreksi">✎ Koreksi Tercatat: <strong>${savedVal}</strong></div></div>`;
                            defaultInputVal = savedVal;
                        } else {
                            badgeHtml = `<div id="badgeContainer_${index}"></div>`;
                        }

                        cardsHtml += `
                            <div class="data-item-card">
                                <div class="data-label">${row.label}</div>
                                <div class="data-value">${row.val}</div>
                                ${badgeHtml}
                                <div class="action-row" id="actionContainer_${index}" style="margin-top: 10px;">
                                    <button class="btn-sesuai" onclick="kirimData('${row.label}', 'Sesuai', ${index})">Sesuai</button>
                                    <button class="btn-koreksi" onclick="bukaFormKoreksi(${index})">Koreksi</button>
                                </div>
                                <div class="edit-container" id="editContainer_${index}">
                                    <input type="text" id="editInput_${index}" class="edit-input" value="${defaultInputVal}" placeholder="Ketik perbaikan yang benar...">
                                    <button class="btn-kirim" onclick="kirimKoreksiData('${row.label}', ${index})">Kirim Perbaikan</button>
                                </div>
                            </div>
                        `;
                    });

                    document.getElementById('dataCardList').innerHTML = cardsHtml;
                    resultCard.style.display = 'block';
                } else {
                    errorBox.innerHTML = 'Data siswa dengan NIPD <strong>' + nipd + '</strong> tidak ditemukan di database sekolah.';
                    errorBox.style.display = 'block';
                }
            })
            .catch(error => {
                loadingDiv.style.display = 'none';
                errorBox.innerHTML = 'Gagal terhubung ke server sekolah. Periksa kembali jaringan internet Anda.';
                errorBox.style.display = 'block';
                console.error(error);
            });
    }

    function bukaFormKoreksi(index) {
        let container = document.getElementById(`editContainer_${index}`);
        container.style.display = container.style.display === 'block' ? 'none' : 'block';
    }

    function kirimData(fieldLabel, teksKirim, index) {
        let payload = {
            nipd: currentSiswaNipd,
            nama: currentSiswaNama,
                    field: fieldLabel,
            koreksi: teksKirim
        };

        fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(response => {
            let badgeContainer = document.getElementById(`badgeContainer_${index}`);
            if(teksKirim === 'Sesuai') {
                badgeContainer.innerHTML = `<div class="status-badge badge-sesuai">✓ Status: Sesuai</div>`;
                document.getElementById(`editContainer_${index}`).style.display = 'none';
                alert(`"${fieldLabel}" berhasil disimpan sebagai Sesuai.`);
            } else {
                badgeContainer.innerHTML = `<div class="status-badge badge-koreksi">✎ Koreksi Tercatat: <strong>${teksKirim}</strong></div>`;
                alert(`Koreksi untuk "${fieldLabel}" berhasil dikirim!`);
                bukaFormKoreksi(index);
            }
        })
        .catch(err => {
            alert('Gagal mengirim data. Silakan coba beberapa saat lagi.');
            console.error(err);
        });
    }

    function kirimKoreksiData(fieldLabel, index) {
        let inputVal = document.getElementById(`editInput_${index}`).value.trim();
        if (!inputVal) {
            alert('Harap ketik data yang benar terlebih dahulu sebelum mengirim!');
            return;
        }
        
        kirimData(fieldLabel, inputVal, index);
    }
</script>

</body>
</html>
