<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Data Siswa</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f8; }
        .card { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; }
        input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #218838; }
        #statusMessage { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>Form Verifikasi Kelurahan</h2>
    <form id="verifForm">
        <div class="form-group">
            <label for="nipd">NIPD Siswa:</label>
            <input type="text" id="nipd" required placeholder="Contoh: 2627100240">
        </div>
        
        <div class="form-group">
            <label for="kelurahan">Kelurahan:</label>
            <input type="text" id="kelurahan" required placeholder="Contoh: Sesuai / Ciptagumati">
        </div>

        <button type="submit" id="btnKirim">Simpan Data</button>
    </form>
    <p id="statusMessage"></p>
</div>

<script>
    // URL Web App terbaru Anda sudah otomatis terpasang di sini
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzROd3G1_m6FltUyzR5vD_bQlPmjcoI4xB4mD8NuWN8ROkKs9_cMZ7cuJqj5m-xgtFV2A/exec";

    document.getElementById("verifForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const btn = document.getElementById("btnKirim");
        const msg = document.getElementById("statusMessage");
        
        btn.disabled = true;
        msg.style.color = "blue";
        msg.textContent = "Mengirim data...";

        // Di web tertulis "kelurahan", tapi dikirim ke script untuk mengisi "Kesesuaian Desa"
        const payload = {
            nipd: document.getElementById("nipd").value,
            "Kesesuaian Desa": document.getElementById("kelurahan").value 
        };

        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(() => {
            msg.style.color = "green";
            msg.textContent = "Berhasil! Data tersimpan.";
            btn.disabled = false;
            document.getElementById("verifForm").reset();
        })
        .catch(err => {
            console.error(err);
            msg.style.color = "red";
            msg.textContent = "Terjadi kesalahan koneksi.";
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
