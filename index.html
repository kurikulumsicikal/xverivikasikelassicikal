<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Kesesuaian Data Siswa - Kelas X</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0fdf4; margin: 0; padding: 10px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
        .container { background: #ffffff; padding: 25px 20px; border-radius: 14px; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.1); max-width: 600px; width: 100%; margin-top: 10px; border-top: 5px solid #2563eb; }
        h2 { text-align: center; color: #1e40af; margin-top: 0; margin-bottom: 6px; font-size: 22px; }
        p.subtitle { text-align: center; color: #4b5563; margin-bottom: 20px; font-size: 13px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        input[type="text"] { flex: 1; padding: 11px 14px; border: 2px solid #bfdbfe; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #2563eb; }
        button { padding: 11px 18px; background-color: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #1d4ed8; }
        .loading { text-align: center; color: #1e40af; display: none; margin: 20px 0; font-weight: 600; font-size: 14px; }
        .error-box { background-color: #fef2f2; color: #991b1b; padding: 14px; border-radius: 8px; border: 1px solid #fecaca; display: none; text-align: center; margin-top: 15px; font-size: 14px; font-weight: 600; }
        .result-card { display: none; margin-top: 15px; }
        .instruction { background-color: #eff6ff; border: 1px solid #dbeafe; color: #1e40af; padding: 12px 14px; border-radius: 8px; font-size: 12px; margin-bottom: 15px; line-height: 1.4; }
        
        /* Kotak Resume Progress Status di Atas */
        .resume-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .resume-title { margin-top: 0; color: #1e40af; font-size: 15px; margin-bottom: 10px; font-weight: bold; }
        .resume-grid { display: flex; gap: 10px; text-align: center; }
        .resume-item-sesuai { flex: 1; background: #dcfce7; padding: 8px; border-radius: 6px; }
        .resume-item-koreksi { flex: 1; background: #fee2e2; padding: 8px; border-radius: 6px; }
        .resume-item-belum { flex: 1; background: #f3f4f6; padding: 8px; border-radius: 6px; }

        .data-item-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 12px; transition: box-shadow 0.2s; }
        .data-item-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .data-label { font-size: 12px; font-weight: 700; color: #2563eb; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
        .data-value { font-size: 15px; font-weight: 600; color: #1e293b; margin-bottom: 10px; word-break: break-word; }
        .action-row { display: flex; gap: 8px; margin-top: 8px; }
        
        /* Tombol Sesuai Biru, Koreksi Merah */
        .btn-sesuai { background-color: #2563eb; color: white; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; flex: 1; transition: background-color 0.2s; }
        .btn-sesuai:hover { background-color: #1d4ed8; }
        .btn-koreksi { background-color: #dc2626; color: white; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; flex: 1; transition: background-color 0.2s; }
        .btn-koreksi:hover { background-color: #b91c1c; }

        .edit-container { display: none; margin-top: 12px; }
        .edit-input { width: 100%; padding: 9px 12px; font-size: 14px; border: 2px solid #bfdbfe; border-radius: 6px; margin-bottom: 8px; outline: none; }
        .edit-input:focus { border-color: #2563eb; }
        .btn-kirim { background-color: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; width: 100%; font-weight: 600; }
        .btn-kirim:hover { background-color: #1d4ed8; }
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; margin-top: 6px; }
        .badge-sesuai { background-color: #dcfce7; color: #166534; width: 100%; text-align: center; }
        .badge-koreksi { background-color: #fee2e2; color: #991b1b; width: 100%; word-break: break-word; }

        /* Kotak Resume Keseluruhan Data di Bawah */
        .final-summary-box { background: #f8fafc; border: 2px solid #cbd5e1; border-radius: 10px; padding: 18px; margin-top: 25px; margin-bottom: 20px; }
        .final-summary-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 12px; }
        .final-summary-title { margin: 0; color: #1e40af; font-size: 16px; font-weight: bold; text-transform: uppercase; }
        .btn-print { background-color: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-print:hover { background-color: #0369a1; }

        .final-summary-list { font-size: 14px; color: #334155; line-height: 1.6; }
        .final-summary-row { display: flex; margin-bottom: 6px; border-bottom: 1px dashed #e2e8f0; padding-bottom: 4px; }
        .final-summary-label { width: 40%; font-weight: 600; color: #475569; }
        .final-summary-val { width: 60%; font-weight: 500; color: #0f172a; word-break: break-word; }
        
        /* Teks Perubahan Warna Hijau */
        .val-koreksi-text { color: #16a34a; font-weight: 600; }

        .statement-box { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 10px; padding: 15px; text-align: center; margin-top: 20px; font-size: 13px; color: #1e40af; line-height: 1.5; font-weight: 600; }

        .title-cetak { display: none; }

        @media print {
            @page { size: A4; margin: 20mm; }
            body { background: #ffffff !important; padding: 0 !important; margin: 0 !important; }
            .container { box-shadow: none !important; border: none !important; max-width: 100% !important; width: 100% !important; margin: 0 !important; padding: 0 !important; border-top: none !important; }
            .search-box, .subtitle, h2, .loading, .error-box, .resume-box, .instruction, .data-item-card, .btn-print, .statement-box { display: none !important; }
            .final-summary-box { border: 2px solid #000000 !important; background: #ffffff !important; margin: 0 !important; padding: 20px !important; page-break-inside: avoid; }
            .final-summary-header { border-bottom: 2px solid #000000 !important; text-align: center; display: block !important; }
            .title-layar { display: none !important; }
            .title-cetak { display: block !important; font-size: 18px !important; color: #000000 !important; text-align: center; }
            .final-summary-row { border-bottom: 1px solid #cbd5e1 !important; padding-bottom: 6px !important; margin-bottom: 8px !important; }
            .final-summary-label { color: #000000 !important; }
            .final-summary-val { color: #000000 !important; }
            .val-koreksi-text { color: #16a34a !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>VERIVIKASI DATA SISWA KELAS X</h2>
    <p class="subtitle">Masukkan NIPD Anda untuk memeriksa dan mengonfirmasi kesesuaian data administrasi.</p>
    
    <div class="search-box">
        <input type="text" id="nipdInput" placeholder="Masukkan NIPD Anda...">
        <button onclick="verifikasiSiswa()">Cek Data</button>
    </div>

    <div id="loading" class="loading">Memeriksa database sekolah...</div>
